<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-red: #e11d48;
            --dark-red: #be123c;
            --light-red: #fda4af;
            --dark-bg: #0a0a0a;
            --darker-bg: #000000;
            --card-bg: #171717;
            --text-light: #fafafa;
            --text-gray: #a3a3a3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(23, 23, 23, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(225, 29, 72, 0.25);
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            background: var(--primary-red);
            padding: 10px;
            border-radius: 10px;
            margin-right: 12px;
        }

        .logo-text {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--primary-red), var(--light-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-gray);
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-light);
        }

        .input-field {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(225, 29, 72, 0.3);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.2);
        }

        .input-field::placeholder {
            color: var(--text-gray);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--light-red) 0%, var(--primary-red) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px rgba(225, 29, 72, 0.4);
        }

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            margin-top: 1.5rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--light-red);
        }

        .back-link i {
            margin-right: 0.5rem;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .logo-text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.querySelector('form');
            const pass = document.getElementById('pass');
            const pass1 = document.getElementById('pass1');

            form.addEventListener('submit', function (event) {
                if (pass.value !== pass1.value) {
                    event.preventDefault(); // stop form submission
                    alert('Passwords do not match. Please re-enter.');
                }
            });
        });
    </script>

    <div class="card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-fire text-white"></i>
            </div>
            <div class="logo-text text-white">Quiz<span class="gradient-text">Forge</span></div>
        </div>

        <h1 class="text-white">Reset Your Password</h1>
<br>

        <form action="/conform" method="POST" novalidate>
            <div class="container" role="main" aria-labelledby="confirm-password-title">
                    <input type="hidden" id="token" name="token" th:value="${token}" />
                </div>
            <div class="form-group">
                <label for="email">Enter your new password</label>
                <input type="password" id="pass" name="password" class="input-field" placeholder="Enter new password"
                    required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="email">Re-enter password</label>
                <input type="password" id="pass1" name="password1" class="input-field"
                    placeholder="Re-enter new password" required autocomplete="email">
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                Done
            </button>
        </form>

        <a href="/login" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>
</body>

</html>
