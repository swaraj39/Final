<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #000000;
      color: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background-color: #111;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(255, 0, 0, 0.3);
      text-align: center;
      animation: fadeIn 1.2s ease-out;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #ff3c3c;
    }

    h2, h3 {
      color: #e0e0e0;
    }

    .progress-circle {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
    }

    .progress-circle svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .progress-circle circle {
      fill: none;
      stroke-width: 10;
    }

    .bg-circle {
      stroke: #333;
    }

    .progress {
      stroke: #ff3c3c;
      stroke-dasharray: 283;
      stroke-dashoffset: calc(283 - (283 * var(--percentage)) / 100);
      transition: stroke-dashoffset 1s ease;
    }

    .percentage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
    }

    .question-container {
      background-color: #000;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
      transition: transform 0.4s ease, box-shadow 0.3s ease;
      animation: slideUp 0.8s ease;
    }

    .question-container:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }

    .options p {
      margin: 8px 0;
    }

    .correct-answer {
      color: #4CAF50;
      font-weight: bold;
    }

    .user-answer {
      color: #ff3c3c;
      font-weight: bold;
    }

    .wrong-answer {
      color: #FF5252;
      font-weight: bold;
    }

    a {
      color: #ff3c3c;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
      transition: color 0.3s;
    }

    a:hover {
      color: #fff;
    }

    button {
      background-color: #ff3c3c;
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #ff1f1f;
    }

    .hello-text {
      color: #ff3c3c;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script>
    function showHello(button) {
      const container = button.nextElementSibling;
      if(container.style.display == 'none'){
        container.style.display = 'block';

      }
      else{
        container.style.display='none';
      }

    }
  </script>

</head>

<body>
<div class="container">
  <h1 th:if="${rate>5}">🎉 Congratulations!</h1>
  <h1 th:unless="${rate>5}">🤔 Try Again!</h1>
  <h3>Your Quiz Result: <span th:text="${result}"></span> out of <span th:text="${total}"></span></h3>

  <div class="progress-circle">
    <svg>
      <circle class="bg-circle" cx="60" cy="60" r="45"></circle>
      <circle class="progress" cx="60" cy="60" r="45"
              style="--percentage: ${percentage};"></circle>
    </svg>
    <div class="percentage" th:text="${percentage + '%'}"></div>
  </div>

  <h2>All Questions and Your Answers:</h2>

  <div th:each="q : ${results}" class="question-container">
    <p><strong>Q:</strong> <span th:text="${q.question}"></span></p>
    <div class="options">
      <p>1: <span th:text="${q.option1}"></span></p>
      <p>2: <span th:text="${q.option2}"></span></p>
      <p>3: <span th:text="${q.option3}"></span></p>
      <p>4: <span th:text="${q.option4}"></span></p>

      <p th:class="${q.isCorrect} ? 'user-answer' : 'wrong-answer'">
        <span th:if="${q.isCorrect}">✔ Your Answer: <span th:text="${q.userAnswer}"></span></span>
        <span th:if="${!q.isCorrect}">✖ Your Answer: <span th:text="${q.userAnswer}"></span></span>
      </p>

      <p class="correct-answer">✅ Correct Answer: <span th:text="${q.correctAnswer}"></span></p>
    </div>

    <!-- <button type="button" onclick="showHello(this)">Explain Answer </button>
    <div class="hello-text" style="display: none; margin-top: 10px;" >Hello</div>
     -->
    <a th:href="@{'https://www.google.com/search?q=' + ${q.question}}" target="_blank">
    <button type="button">Explain Answer</button>
</a>

  </div>

  <a href="/ques/before">🔁 Take the quiz again</a>
</div>
</body>
</html>
