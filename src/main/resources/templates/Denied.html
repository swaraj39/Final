<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - QuizForge</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ef4444;
            --dark-red: #dc2626;
            --dark-bg: #0f0f0f;
            --darker-bg: #050505;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom right, var(--darker-bg), var(--dark-bg));
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        .glow-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }
        
        .gradient-text {
            background: linear-gradient(90deg, #ef4444, #f87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .forbidden-icon {
            font-size: 8rem;
            color: rgba(239, 68, 68, 0.8);
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                text-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 0 40px rgba(239, 68, 68, 0.8);
            }
            100% {
                transform: scale(1);
                text-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
            }
        }
        
        .card {
            background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent, 
                rgba(239, 68, 68, 0.1), 
                transparent
            );
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% {
                left: -50%;
            }
            100% {
                left: 150%;
            }
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        
        .button {
            background: linear-gradient(90deg, var(--primary-red), var(--dark-red));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
        }
        
        .button i {
            margin-right: 8px;
        }
        
        .logo {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .logo-icon {
            background: var(--primary-red);
            padding: 8px;
            border-radius: 8px;
            margin-right: 10px;
        }
        
        .error-code {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 1.2rem;
            opacity: 0.7;
        }
        
        .red-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary-red);
            border-radius: 50%;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .card {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .forbidden-icon {
                font-size: 6rem;
            }
            
            .logo {
                left: 20px;
                top: 20px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="red-dots" id="redDots"></div>
    
    <div class="logo">
        <div class="logo-icon">
            <i class="fas fa-bolt"></i>
        </div>
        <span>Quiz<span class="gradient-text">Forge</span></span>
    </div>
    
    <div class="card glow-red">
        <i class="fas fa-ban forbidden-icon"></i>
        <h1>Access <span class="gradient-text">Denied</span></h1>
        <p>You don't have permission to access this page. Please contact your administrator if you believe this is a mistake.</p>
        <a href="/home" class="button">
            <i class="fas fa-arrow-left"></i> Return to Page
        </a>
    </div>
    
    <div class="error-code">
        Error 403: Forbidden
    </div>

    <script>
        // Create red dots for background effect
        const container = document.getElementById('redDots');
        const dotsCount = 30;
        
        for (let i = 0; i < dotsCount; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            
            // Random position
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            
            dot.style.left = `${posX}%`;
            dot.style.top = `${posY}%`;
            
            // Random size
            const size = 2 + Math.random() * 4;
            dot.style.width = `${size}px`;
            dot.style.height = `${size}px`;
            
            // Random opacity
            dot.style.opacity = 0.2 + Math.random() * 0.3;
            
            container.appendChild(dot);
        }
    </script>
</body>
</html>
