<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Confirmation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
    />
    <style>
        body {
          font-family: 'Inter', Arial, sans-serif;
          background-color: #000000;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-4 bg-black">
<div
        class="bg-black border-2 border-red-600 p-8 rounded-lg shadow-lg max-w-md w-full text-center"
        role="main"
        aria-label="Code confirmation form"
>
    <h1 class="text-red-600 text-3xl font-semibold mb-6">Code Confirmation</h1>
    <h3 class="text-red-400 text-xl mb-6 leading-relaxed">
        Enter the OTP shared on <br />
        <span class="font-medium text-red-500" id="emailPlaceholder" th:text="${email}">user@example.com</span>
    </h3>
    
    <strong class="text-red-500 text-lg mb-6 block">
        Note: The code is valid for 30 seconds.
    </strong>
    <div class="loader-container mb-6 flex justify-center items-center">
        <span class="emoji-loader text-6xl select-none" aria-hidden="true" style="text-shadow: 0 0 8px #ff0000;">🔒</span>
    </div>
    <form
            id="codeForm"
            method="POST"
            action="/codewala"
            class="space-y-6"
            autocomplete="one-time-code"
            aria-describedby="timer"
    >
    <input type="hidden" name="email" th:value="${email}">
        <div class="flex justify-center space-x-3">
            <input
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    maxlength="1"
                    class="code-input w-14 h-14 text-center text-2xl border border-red-600 rounded-md focus:outline-none focus:ring-2 focus:ring-red-600 bg-black text-red-500 placeholder-red-700"
                    required
                    aria-label="Digit 1"
                    placeholder="•"
            />
            <input
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    maxlength="1"
                    class="code-input w-14 h-14 text-center text-2xl border border-red-600 rounded-md focus:outline-none focus:ring-2 focus:ring-red-600 bg-black text-red-500 placeholder-red-700"
                    required
                    aria-label="Digit 2"
                    placeholder="•"
            />
            <input
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    maxlength="1"
                    class="code-input w-14 h-14 text-center text-2xl border border-red-600 rounded-md focus:outline-none focus:ring-2 focus:ring-red-600 bg-black text-red-500 placeholder-red-700"
                    required
                    aria-label="Digit 3"
                    placeholder="•"
            />
            <input
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    maxlength="1"
                    class="code-input w-14 h-14 text-center text-2xl border border-red-600 rounded-md focus:outline-none focus:ring-2 focus:ring-red-600 bg-black text-red-500 placeholder-red-700"
                    required
                    aria-label="Digit 4"
                    placeholder="•"
            />
            <input
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    maxlength="1"
                    class="code-input w-14 h-14 text-center text-2xl border border-red-600 rounded-md focus:outline-none focus:ring-2 focus:ring-red-600 bg-black text-red-500 placeholder-red-700"
                    required
                    aria-label="Digit 5"
                    placeholder="•"
            />
        </div>
        <input type="hidden" id="fullCode" name="codes" />
        <input
                type="submit"
                value="Verify"
                class="w-full py-3 bg-red-600 text-black font-semibold rounded-md cursor-pointer hover:bg-red-700 transform transition-transform duration-300 ease-in-out hover:scale-105"
                aria-label="Verify code"
        />
    </form>

    <div
            id="timer"
            class="text-red-500 mt-4 text-lg font-medium"
            role="timer"
            aria-live="polite"
            aria-atomic="true"
    ></div>
    <button
            id="resendBtn"
            class="w-full py-3 bg-red-800 text-red-300 rounded-md cursor-pointer mt-4 hidden hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-600"
            onclick="location.href='/resend'"
            aria-label="Resend code"
    >
        Resend
    </button>
</div>

<script>
    let timeRemaining = 30;
    let timerInterval;
    const timerElement = document.getElementById('timer');
    const resendButton = document.getElementById('resendBtn');

    function startTimer() {
      timerElement.textContent = `Time Remaining: ${timeRemaining}s`;
      timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      if (timeRemaining > 0) {
        timeRemaining--;
        timerElement.textContent = `Time Remaining: ${timeRemaining}s`;
      } else {
        clearInterval(timerInterval);
        timerElement.textContent = "Time's up!";
        alert("Time's up! Please request a new code.");
        resendButton.classList.remove('hidden');
      }
    }

    window.onload = () => {
      startTimer();

      const inputs = document.querySelectorAll('.code-input');
      inputs.forEach((input, index) => {
        input.addEventListener('input', () => {
          input.value = input.value.replace(/[^0-9]/g, '');
          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && input.value === '' && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });

      document.getElementById('codeForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const codeInputs = document.querySelectorAll('.code-input');
        let fullCode = '';
        codeInputs.forEach((input) => {
          fullCode += input.value;
        });
        document.getElementById('fullCode').value = fullCode;
        this.submit();
      });
    };
</script>
</body>
</html>
