<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>
        Update Account
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <style>
        :root {
            --primary-red: #e11d48;
            --dark-red: #be123c;
            --light-red: #fda4af;
            --dark-bg: #0a0a0a;
            --darker-bg: #000000;
            --card-bg: #171717;
            --text-light: #fafafa;
            --text-gray: #a3a3a3;
        }

        body {
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }

        .red-card {
            background: rgba(23, 23, 23, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(225, 29, 72, 0.25);
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1.75rem;
        }

        .red-gradient-text {
            background: linear-gradient(135deg, var(--primary-red), var(--light-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .button-red {
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
            transition: all 0.3s ease;
        }

        .button-red:hover {
            background: linear-gradient(135deg, var(--light-red) 0%, var(--primary-red) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px rgba(225, 29, 72, 0.4);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(225, 29, 72, 0.25);
            color: var(--text-light);
            transition: all 0.3s ease;
            font-size: 0.95rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .input-field::placeholder {
            color: var(--text-gray);
        }

        input[type="radio"].peer:checked+img {
            border-color: #e11d48;
        }
    </style>
</head>

<body>
    <div class="red-card" id="sign-up-form">
        <h2 class="text-xl font-bold text-white mb-6 text-center">
            Update Account
        </h2>
        <form action="/update" class="space-y-5" method="POST">
            <div>
                <div class="form-section">
                    <label class="block text-gray-300 mb-2 text-sm">Avatar</label>
                    <div class="flex space-x-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="avatar" value="Avtar1.png" class="hidden peer" required
                                th:checked="${user.avatar == 'Avtar1.png'}">
                            <img th:src="@{/images/Avtar1.png}" alt="Avatar 1"
                                class="w-12 h-12 rounded-full border-2 border-transparent peer-checked:border-red-500">
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="avatar" value="Avtar2.png" class="hidden peer"
                                th:checked="${user.avatar == 'Avtar2.png'}">
                            <img th:src="@{/images/Avtar2.png}" alt="Avatar 2"
                                class="w-12 h-12 rounded-full border-2 border-transparent peer-checked:border-red-500">
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="avatar" value="Avtar3.png" class="hidden peer"
                                th:checked="${user.avatar == 'Avtar3.png'}">
                            <img th:src="@{/images/Avtar3.png}" alt="Avatar 3"
                                class="w-12 h-12 rounded-full border-2 border-transparent peer-checked:border-red-500">
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="avatar" value="Avtar4.png" class="hidden peer"
                                th:checked="${user.avatar == 'Avtar4.png'}">
                            <img th:src="@{/images/Avtar4.png}" alt="Avatar 4"
                                class="w-12 h-12 rounded-full border-2 border-transparent peer-checked:border-red-500">
                        </label>
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-gray-300 mb-2 text-sm font-medium" for="name">
                    Name
                </label>
                <input class="w-full input-field" id="name" name="name" placeholder="Your Name" required="" type="text"
                    th:value="${user.name}" />
            </div>
            <div>
                <label class="block text-gray-300 mb-2 text-sm font-medium" for="email">
                    Email Address
                </label>
                <input class="w-full input-field" id="email" name="email" placeholder="you@example.com" required=""
                    type="email" th:value="${user.email}" />
            </div>
            <div>
                <label class="block text-gray-300 mb-2 text-sm font-medium" for="phoneno">
                    Phone
                </label>
                <input class="w-full input-field" id="phoneno" name="phoneno" placeholder="Your Phone Number" type="tel"
                    th:value="${user.phoneno}" />
            </div>
            <button class="w-full button-red text-white py-2.5 rounded-lg font-semibold text-sm" id="sign-up-btn"
                type="submit">
                Update
            </button>
        </form>
    </div>
</body>

</html>
