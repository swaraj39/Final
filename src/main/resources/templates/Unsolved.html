<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Daily Question Streak
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
      font-family: 'Inter', sans-serif;
    }
  </style>
 </head>
 <body class="bg-gradient-to-b from-blue-50 to-white min-h-screen flex flex-col items-center justify-center px-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-lg p-8 text-center">
   <img alt="Illustration of a person celebrating with confetti and a trophy, symbolizing achievement and success" class="mx-auto mb-6" height="150" loading="lazy" src="https://storage.googleapis.com/a1aa/image/554325c6-1ea7-40a7-67dd-159c08b71f4b.jpg" width="150"/>
   <h1 class="text-3xl font-semibold text-red-700 mb-4">
    Streak Broken!
   </h1>
   <p class="text-gray-700 text-lg mb-6">
    Come tomorrow! Your current streak is:
   </p>
   <div aria-label="Current streak count" class="inline-flex items-center justify-center bg-blue-100 text-blue-800 font-bold text-4xl rounded-full w-24 h-24 mx-auto mb-6 shadow-md select-none">
    7 -> 0
   </div>
   <p class="text-gray-600 text-base mb-8">
    Stay consistent to keep your streak going and unlock new achievements.
   </p>
   <button aria-label="View next question" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-colors duration-300 focus:outline-none focus:ring-4 focus:ring-blue-300" type="button">
    To Home
    <i class="fas fa-arrow-right ml-2">
    </i>
   </button>
  </div>
 </body>
</html>
