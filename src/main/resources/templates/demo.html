<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QuizMaster - Select Your Category</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <style>
        /* ... styles unchanged ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000 0%, #ff0000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(to right, #ff0000, #000000);
            color: white;
            padding: 25px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
            border-color: #ff0000;
        }

        .category-card.selected {
            border-color: #2575fc;
            background-color: #f0f7ff;
        }

        .category-icon {
            font-size: 2.5rem;
            padding: 20px 0;
            color: #ff0000;
        }

        .category-name {
            padding: 15px;
            font-weight: 600;
            background: #f8f9fa;
            color: #444;
        }

        .action-section {
            text-align: center;
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .start-btn {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(106, 17, 203, 0.5);
        }

        .start-btn:active {
            transform: translateY(1px);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #666;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #6a11cb;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .categories-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <header>
        <h1>QuizMaster</h1>
        <p class="subtitle">Select a category and test your knowledge!</p>
    </header>

    <div class="content">
        <!-- Form to submit category -->
        <form action="/ques/test" method="get" id="categoryForm">
            <input type="hidden" name="categoryValue" id="selectedCategoryInput">

            <div class="categories-grid" id="categories-grid">
                
                <div class="category-card"
                     th:each="category : ${categories}"
                     th:data-name="${category.name}"
                     onclick="selectCategory(this)">
                    <div class="category-icon">
                        <!-- <i class="fas" th:classappend="' ' + ${category.icon}"></i> -->
                         <i class="fas fa-code"></i>
                    </div>
                    <div class="category-name text-4xl" th:text="${category.name}">Category</div>
                </div>
            </div>

            <div class="action-section">
                <button type="submit" class="start-btn" id="start-btn" disabled>
                    <i class="fas fa-play-circle"></i> Start Quiz
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function selectCategory(cardElement) {
        const categoryName = cardElement.getAttribute('data-name');

        // Set hidden input value
        document.getElementById('selectedCategoryInput').value = categoryName;

        // Highlight selected card
        document.querySelectorAll('.category-card').forEach(card => {
            card.classList.remove('selected');
        });
        cardElement.classList.add('selected');

        // Enable the button
        document.getElementById('start-btn').disabled = false;
    }
</script>
</body>
</html>
